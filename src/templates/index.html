<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vinita Silaparasetty | Compliance-First AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --brand-color: #0d6efd; --audit-green: #00ff00; }
        body { background-color: #f4f7f6; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Header Styling */
        .navbar { background: white; border-bottom: 2px solid #e9ecef; padding: 1rem 2rem; }
        .brand-title { font-weight: 700; color: #343a40; letter-spacing: -1px; }
        
        /* Main Container */
        .dashboard-container { display: flex; gap: 20px; padding: 20px; height: calc(100vh - 180px); }
        
        /* Chat Section */
        .chat-section { flex: 3; display: flex; flex-direction: column; background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow: hidden; }
        #chat-window { flex-grow: 1; overflow-y: auto; padding: 25px; background: #ffffff; }
        .chat-input-area { padding: 20px; border-top: 1px solid #eee; background: #fafafa; }
        
        /* Audit Section */
        .audit-section { flex: 2; display: flex; flex-direction: column; background: #212529; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .audit-header { padding: 15px 20px; border-bottom: 1px solid #3d4145; display: flex; justify-content: space-between; align-items: center; color: white; }
        #log-window { flex-grow: 1; overflow-y: auto; padding: 20px; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.85rem; color: var(--audit-green); }
        
        /* Message Bubbles */
        .user-msg { color: var(--brand-color); font-weight: 600; margin-bottom: 8px; }
        .ai-msg { background: #f8f9fa; padding: 15px; border-radius: 8px; border-left: 4px solid #198754; margin-bottom: 20px; line-height: 1.5; }
        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; opacity: 0.9; }

        footer { background: white; padding: 20px; border-top: 1px solid #dee2e6; margin-top: 20px; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container-fluid">
            <span class="navbar-brand brand-title">🛡️ COMPLIANCE-FIRST AI</span>
            <div class="text-end">
                <h5 class="mb-0">Vinita Silaparasetty</h5>
                <span class="badge bg-primary">System Architect</span>
            </div>
        </div>
    </nav>

    <div class="dashboard-container">
        <div class="chat-section">
            <div id="chat-window"></div>
            <div class="chat-input-area">
                <div class="input-group">
                    <input type="text" id="user-input" class="form-control form-control-lg" placeholder="Ask about hardware specifications...">
                    <button class="btn btn-primary px-4" id="send-btn" onclick="sendMessage()">Process Request</button>
                </div>
            </div>
        </div>

        <div class="audit-section">
            <div class="audit-header">
                <span class="fw-bold">📑 LIVE AUDIT TRAIL</span>
                <button class="btn btn-outline-light btn-sm" onclick="clearLogs()">Reset Logs</button>
            </div>
            <div id="log-window">
                <div id="initial-log">[SYSTEM] Multi-agent audit listener active...</div>
            </div>
        </div>
    </div>

    <footer class="text-center text-muted">
        <p class="mb-1">&copy; 2026 Vinita Silaparasetty. All Rights Reserved.</p>
        <p class="small mb-0">Proprietary Architecture: PII Scrubbing | RAG Grounding | Multi-Intent Routing</p>
    </footer>

    <script>
        function clearLogs() {
            document.getElementById('log-window').innerHTML = '<div id="initial-log">[SYSTEM] Log history cleared...</div>';
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat-window');
            const logs = document.getElementById('log-window');
            const sendBtn = document.getElementById('send-btn');
            const msg = input.value;
            
            if (!msg) return;

            chat.innerHTML += `<div class="user-msg">User: ${msg}</div>`;
            const loadingId = "loading-" + Date.now();
            chat.innerHTML += `<div id="${loadingId}" class="text-muted small italic"><span class="spinner-border spinner-border-sm"></span> Architecting secure response...</div>`;
            
            input.value = '';
            sendBtn.disabled = true;

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({message: msg})
                });
                
                const data = await response.json();
                document.getElementById(loadingId).remove();

                chat.innerHTML += `<div class="ai-msg"><strong>AI Agent:</strong> ${data.agent_outcome}</div>`;
                
                const initial = document.getElementById('initial-log');
                if (initial) initial.remove();

                if (data.compliance_logs) {
                    data.compliance_logs.forEach(log => {
                        logs.innerHTML += `<div class="log-entry">> ${log}</div>`;
                    });
                }
                
                logs.scrollTop = logs.scrollHeight;
                chat.scrollTop = chat.scrollHeight;
            } catch (err) {
                if (document.getElementById(loadingId)) document.getElementById(loadingId).remove();
                logs.innerHTML += `<div class="text-danger">> System Fault: ${err.message}</div>`;
            } finally {
                sendBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
